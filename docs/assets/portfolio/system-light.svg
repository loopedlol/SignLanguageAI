<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">SignLanguageAI system diagram</title><desc id="desc">Implementation-oriented diagram; arrows identify information flow. See adjacent README text for accessible explanation and limitations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#53636b"/></marker></defs><rect width="1200" height="580" rx="12" fill="#f3f2ed"/><text x="35" y="42" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9a4936" font-weight="700">03 / TEMPORAL COMPUTER VISION / SYSTEM MAP</text><text x="35" y="79" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172329" font-weight="700">One frame becomes features. A sequence becomes a prediction.</text><rect x="35" y="112" width="330" height="116" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="35" y="130" width="4" height="80" fill="#9a4936"/><text x="57" y="146" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Webcam + MediaPipe</text><text x="57" y="177" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >33 pose + 478 face + 42 hand</text><text x="57" y="201" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Missing groups are zero-filled</text><rect x="435" y="112" width="330" height="116" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="435" y="130" width="4" height="80" fill="#9a4936"/><text x="457" y="146" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Normalize</text><text x="457" y="177" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Shoulder midpoint + width</text><text x="457" y="201" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Fixed feature layout: 1,659</text><rect x="835" y="112" width="330" height="116" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="835" y="130" width="4" height="80" fill="#9a4936"/><text x="857" y="146" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Temporal window</text><text x="857" y="177" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Trim / zero-pad recorded samples</text><text x="857" y="201" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >30 frames by default</text><path d="M370 170H428" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><path d="M770 170H828" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><rect x="35" y="337" width="330" height="126" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="35" y="355" width="4" height="90" fill="#9a4936"/><text x="57" y="371" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Temporal CNN</text><text x="57" y="402" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Conv1d 256 → 128 → 128</text><text x="57" y="426" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Mean pooling → classifier</text><text x="57" y="450" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >PyTorch logits per sign label</text><rect x="435" y="337" width="330" height="126" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="435" y="355" width="4" height="90" fill="#9a4936"/><text x="457" y="371" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Train + inspect</text><text x="457" y="402" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Seeded train / validation split</text><text x="457" y="426" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Best + latest checkpoints</text><text x="457" y="450" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Per-class evaluation</text><rect x="835" y="337" width="330" height="126" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="835" y="355" width="4" height="90" fill="#9a4936"/><text x="857" y="371" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Live inference</text><text x="857" y="402" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Normalized rolling window</text><text x="857" y="426" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Confidence + recent predictions</text><text x="857" y="450" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Webcam label overlay</text><path d="M1000 233V269H200V328" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><path d="M370 398H428" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><path d="M770 398H828" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><text x="35" y="520" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9a4936" font-weight="700">EVALUATION NOTE</text><text x="35" y="550" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#53636b" >Default evaluation uses the full data directory. Supply separate held-out samples for generalization checks.</text></svg>
